#writing a GitHub Actions workflow to build a C++ project using CMake and Ninja on Windows 
name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (Release)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-2022 runners already ship Visual Studio 2022 Build Tools,
      # CMake, and Ninja (see actions/runner-images) -- installing any of
      # them again here would only slow the job down and add a second,
      # unpinned source of version drift. Entering a Developer Command
      # Prompt is what actually puts cl.exe/link.exe on PATH for CMake.
      - name: Enter VS dev shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Mosaic.exe
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-${{ github.sha }}
          path: build/bin/Mosaic.exe
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enter VS dev shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (with tests)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMOSAIC_BUILD_TESTS=ON

      - name: Verify MosaicTests target exists
        # A previous run hit "ninja: error: unknown target 'MosaicTests'"
        # with no earlier failure in this log to explain why -- most likely
        # a step upstream (the GoogleTest FetchContent download in
        # tests/CMakeLists.txt, or -DMOSAIC_BUILD_TESTS=ON not taking
        # effect) failed or was silently skipped without stopping the job.
        # This check turns that into an immediate, clear failure right
        # after configure, with the full CMake configure log visible above
        # it, instead of a confusing unrelated-looking ninja error two
        # steps later.
        run: |
          if (-not (Test-Path "build\build.ninja")) {
            Write-Error "build\build.ninja was not generated -- CMake configure did not complete. See the Configure step's log above."
            exit 1
          }
          $targets = & ninja -C build -t targets 2>&1
          if (-not ($targets -match "^MosaicTests:")) {
            Write-Error "MosaicTests target was not generated by CMake configure. This means either MOSAIC_BUILD_TESTS wasn't ON, tests/CMakeLists.txt's add_subdirectory never ran, or the GoogleTest FetchContent download failed -- check the Configure step's log above for a 'Mosaic:' status line or a FetchContent error."
            exit 1
          }

      - name: Build tests
        run: cmake --build build --config Debug --target MosaicTests

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Debug